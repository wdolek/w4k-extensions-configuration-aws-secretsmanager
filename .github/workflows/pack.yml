name: Create package

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Package version: <major>.<minor>.<patch>'
        required: true

jobs:
  pack:
    runs-on: ubuntu-latest
    steps:

    - name: Setup node.js
      uses: actions/setup-node@v5
      with:
        node-version: '24'

    - name: Install semver
      run: |
        sudo npm i -g semver

    - name: Validate version
      run: |
        semver ${{ github.event.inputs.version }}
        if [ $? != 0 ]; then exit 1; fi

    - name: Checkout
      uses: actions/checkout@v5

    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: |
          8.0.x
          9.0.x
          10.0.x

    - name: Install dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build --no-restore --configuration Release

    - name: Test
      run: dotnet test tests/W4k.Extensions.Configuration.Aws.SecretsManager.Tests/W4k.Extensions.Configuration.Aws.SecretsManager.Tests.csproj --no-build --configuration Release

    - name: Pack `W4k.Extensions.Configuration.Aws.SecretsManager`
      run: dotnet pack --no-build --configuration Release -p:Version=${{ github.event.inputs.version }} -o artifacts

    - name: Upload artifact
      uses: actions/upload-artifact@v6
      with:
        name: w4k-extensions-configuration-aws-secretsmanager-${{ github.event.inputs.version }}
        path: artifacts/*.nupkg
